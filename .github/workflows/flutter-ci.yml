name: Aurora release checks
on:
  workflow_dispatch:
  push:
    branches: [main, showcase-release]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aurora_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release -t lib/main_demo.dart --no-web-resources-cdn --pwa-strategy=none
      - run: node tools/prepare-demo.mjs
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: npx playwright install --with-deps chromium ffmpeg
        working-directory: .
      - run: npm run test:browser
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-web-demo
          path: aurora_app/build/web
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --ignore-scripts
      - run: npm run test:rules
